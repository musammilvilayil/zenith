name: React migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "react-app/**"
      - ".github/workflows/react-migration.yml"
  push:
    branches: ["migration/react-foundation-ghost-fibers"]
    paths:
      - "react-app/**"
      - ".github/workflows/react-migration.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-app/package.json
      - name: Install dependencies
        run: npm install
      - name: Verify route parity
        run: npm run test:routes
      - name: Build React application
        run: npm run build
