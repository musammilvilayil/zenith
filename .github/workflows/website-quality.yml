name: Website Quality Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find assets api -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: SEO metadata
        run: python3 scripts/check-seo.py
